server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: aether-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${DATABASE_USERNAME:aether}
    password: ${DATABASE_PASSWORD:aether-local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
security:
  jwt:
    secret: ${JWT_   SECRET_BASE64:}
    expiration: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
