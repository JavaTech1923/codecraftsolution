services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aether-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/aether
      DATABASE_USERNAME: aether
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-aether-local}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
  web:
    build: .
    ports:
      - "8081:80"
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
